<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d070" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#99771f" />
      <stop offset="100%" stop-color="#f3cf55" />
    </linearGradient>
    <linearGradient id="pitchDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2416" />
      <stop offset="50%" stop-color="#07140c" />
      <stop offset="100%" stop-color="#050a0f" />
    </linearGradient>
    <linearGradient id="emeraldLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="ballShine" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#6b7280" />
    </linearGradient>
    <linearGradient id="leatherPatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Path -->
  <path
    d="M50 4 C74 4, 88 15, 88 32 C88 64, 50 94, 50 94 C50 94, 12 64, 12 32 C12 15, 26 4, 50 4 Z"
    fill="url(#shieldGoldGrad)"
    stroke="#523e0a"
    stroke-width="1"
  />

  <!-- Inner Shield Body -->
  <path
    d="M50 8 C70 8, 83 18, 83 33 C83 61, 50 88, 50 88 C50 88, 17 61, 17 33 C17 18, 30 8, 50 8 Z"
    fill="url(#pitchDarkGrad)"
  />

  <!-- Pitch Lines inside Shield -->
  <line x1="50" y1="12" x2="50" y2="84" stroke="url(#emeraldLineGrad)" stroke-width="1.2" stroke-dasharray="3 2" />
  <path d="M32 16 L32 30 L68 30 L68 16" fill="none" stroke="url(#emeraldLineGrad)" stroke-width="1.2" stroke-opacity="0.7" />
  <circle cx="50" cy="48" r="16" fill="none" stroke="url(#emeraldLineGrad)" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Championship Laurel Wreath -->
  <path d="M24 38 C21 44, 21 52, 25 58 C27 61, 30 65, 36 70" fill="none" stroke="url(#shieldGoldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M21 42 C18 43, 18 45, 22 47" fill="url(#shieldGoldGrad)" />
  <path d="M20 49 C17 51, 17 53, 21 55" fill="url(#shieldGoldGrad)" />
  <path d="M23 57 C20 60, 21 62, 26 63" fill="url(#shieldGoldGrad)" />
  <path d="M28 65 C26 68, 28 70, 33 69" fill="url(#shieldGoldGrad)" />

  <path d="M76 38 C79 44, 79 52, 75 58 C73 61, 70 65, 64 70" fill="none" stroke="url(#shieldGoldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M79 42 C82 43, 82 45, 78 47" fill="url(#shieldGoldGrad)" />
  <path d="M80 49 C83 51, 83 53, 79 55" fill="url(#shieldGoldGrad)" />
  <path d="M77 57 C80 60, 79 62, 74 63" fill="url(#shieldGoldGrad)" />
  <path d="M72 65 C74 68, 72 70, 67 69" fill="url(#shieldGoldGrad)" />

  <!-- Center Ball -->
  <g transform="translate(0, -1)">
    <circle cx="50" cy="48" r="13" fill="url(#ballShine)" stroke="url(#shieldGoldGrad)" stroke-width="1.5" />
    <polygon points="50,42 56,46 54,53 46,53 44,46" fill="url(#leatherPatch)" stroke="#d4af37" stroke-width="0.8" />
    <line x1="50" y1="42" x2="50" y2="35.5" stroke="#1e293b" stroke-width="1.2" />
    <line x1="56" y1="46" x2="62" y2="44" stroke="#1e293b" stroke-width="1.2" />
    <line x1="54" y1="53" x2="59" y2="58" stroke="#1e293b" stroke-width="1.2" />
    <line x1="46" y1="53" x2="41" y2="58" stroke="#1e293b" stroke-width="1.2" />
    <line x1="44" y1="46" x2="38" y2="44" stroke="#1e293b" stroke-width="1.2" />
  </g>

  <!-- Top Championship Star -->
  <polygon
    points="50,11 52.2,16 57.5,16.5 53.5,20.2 54.8,25.5 50,22.8 45.2,25.5 46.5,20.2 42.5,16.5 47.8,16"
    fill="url(#shieldGoldGrad)"
    stroke="#fff"
    stroke-width="0.4"
  />

  <!-- Bottom Ribbon -->
  <path d="M34 80 L50 86 L66 80 L63 76 L50 81 L37 76 Z" fill="url(#shieldGoldGrad)" stroke="#382806" stroke-width="0.6" />
  <circle cx="50" cy="83.5" r="1.5" fill="#0f2416" />
</svg>
